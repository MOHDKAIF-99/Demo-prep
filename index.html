<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Museum</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            font-weight: 300;
        }
        p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>OUR MUSEUM</h1>
        <p>From Daniel to Emma</p>
    </div>

    <div id="instructions">Click & Drag to Look Around | Use Arrow Keys or W/A/S/D to Move</div>

    <!-- Three.js and OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);
        scene.fog = new THREE.FogExp2(0xf5f5f5, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight.position.set(0, 15, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Room Dimensions
        const roomWidth = 30;
        const roomHeight = 6;
        const roomLength = 30;

        // Floor
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomLength);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceilingGeo = new THREE.PlaneGeometry(roomWidth, roomLength);
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xf9f9f9 });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = roomHeight;
        scene.add(ceiling);

        // Walls
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
        
        // Back Wall
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), wallMat);
        backWall.position.set(0, roomHeight / 2, -roomLength / 2);
        scene.add(backWall);

        // Front Wall
        const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomHeight), wallMat);
        frontWall.position.set(0, roomHeight / 2, roomLength / 2);
        frontWall.rotation.y = Math.PI;
        scene.add(frontWall);

        // Left Wall
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomLength, roomHeight), wallMat);
        leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        // Right Wall
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomLength, roomHeight), wallMat);
        rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
        rightWall.rotation.y = -Math.PI / 2;
        scene.add(rightWall);

        // Function to Add Framed Pictures
        const textureLoader = new THREE.TextureLoader();
        function addPicture(imageURL, x, y, z, rotationY, width = 3, height = 4) {
            // Frame
            const frameGeo = new THREE.BoxGeometry(width + 0.3, height + 0.3, 0.1);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(x, y, z);
            frame.rotation.y = rotationY;
            scene.add(frame);

            // Canvas / Image Placeholder
            const canvasGeo = new THREE.PlaneGeometry(width, height);
            
            // Fallback color material if image fails to load
            let canvasMat = new THREE.MeshBasicMaterial({ color: 0x333333 });

            if(imageURL) {
                textureLoader.load(imageURL, (texture) => {
                    canvasMat.map = texture;
                    canvasMat.needsUpdate = true;
                });
            }

            const canvasMesh = new THREE.Mesh(canvasGeo, canvasMat);
            // Slightly push forward to avoid clipping with frame
            canvasMesh.position.set(x, y, z);
            canvasMesh.rotation.y = rotationY;
            
            // Adjust position slightly based on rotation
            if (rotationY === 0) canvasMesh.position.z += 0.06;
            if (rotationY === Math.PI) canvasMesh.position.z -= 0.06;
            if (rotationY === Math.PI / 2) canvasMesh.position.x += 0.06;
            if (rotationY === -Math.PI / 2) canvasMesh.position.x -= 0.06;

            scene.add(canvasMesh);
        }

        // Add Sample Frames (Replace URLs with your own photos)
        addPicture('', -5, 2.5, -14.9, 0, 3.5, 4);
        addPicture('', 0, 2.5, -14.9, 0, 4, 3);
        addPicture('', 5, 2.5, -14.9, 0, 3.5, 4);

        addPicture('', -14.9, 2.5, -5, Math.PI / 2, 4, 3);
        addPicture('', -14.9, 2.5, 5, Math.PI / 2, 3.5, 4);

        addPicture('', 14.9, 2.5, -5, -Math.PI / 2, 3.5, 4);
        addPicture('', 14.9, 2.5, 5, -Math.PI / 2, 4, 3);

        // Simple First-Person Keyboard Controls & Mouse Look
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveForward = true;
            if (e.key === 's' || e.key === 'ArrowDown') moveBackward = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveLeft = true;
            if (e.key === 'd' || e.key === 'ArrowRight') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveForward = false;
            if (e.key === 's' || e.key === 'ArrowDown') moveBackward = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') moveLeft = false;
            if (e.key === 'd' || e.key === 'ArrowRight') moveRight = false;
        });

        let isMouseDown = false;
        document.addEventListener('mousedown', () => isMouseDown = true);
        document.addEventListener('mouseup', () => isMouseDown = false);
        document.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const movementX = e.movementX || e.clientX - mouseX;
                const movementY = e.movementY || e.clientY - mouseY;
                camera.rotation.y -= movementX * 0.003;
            }
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = 5.0 * delta;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();

            const sideDirection = new THREE.Vector3(-direction.z, 0, direction.x);

            if (moveForward) camera.position.addScaledVector(direction, speed);
            if (moveBackward) camera.position.addScaledVector(direction, -speed);
            if (moveLeft) camera.position.addScaledVector(sideDirection, speed);
            if (moveRight) camera.position.addScaledVector(sideDirection, -speed);

            // Boundary checks to stay inside the room
            camera.position.x = Math.max(-roomWidth / 2 + 1.5, Math.min(roomWidth / 2 - 1.5, camera.position.x));
            camera.position.z = Math.max(-roomLength / 2 + 1.5, Math.min(roomLength / 2 - 1.5, camera.position.z));
            camera.position.y = 2; // Fixed eye level

            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
