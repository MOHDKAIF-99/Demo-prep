<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Our Museum</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="joy"><i></i></div>
<div id="hud"><div id="hint">WASD / arrows walk · drag to look · E sit · F dance · Space view photo</div>
<div class="row"><button id="bSit">Sit (E)</button><button id="bDance">Dance (F)</button><button id="bView">View photo</button><button id="bAdd">Add your photos</button></div></div>
<input id="fi" type="file" accept="image/*" multiple hidden>
<div id="lb" hidden><img id="lbi" alt=""><div id="lbc"></div><div class="row" style="display:flex;gap:8px"><button id="rep">Replace this photo</button><button id="cls">Close</button></div></div>
<div id="intro">
<h1 class="serif">Our Museum</h1>
<div class="names"><span>From</span><input id="n1" value="KAIF" maxlength="14"><span>|</span><span>To</span><input id="n2" value="SUMBULl" maxlength="14"></div>
<div class="bar"><i id="pb"></i></div><div class="meta"><span>Preparing the collection</span><span id="pc">0%</span></div>
<button id="go">Enter the museum</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body></html>
